# Dataset and sampler are chosen on the command line (see main.py), not here.
random_seed: 42
device: "cuda"

cumulative_budget: [25, 50, 75, 100, 125, 150, 175, 200]
output_dir: "checkpoints"
feature_cache_dir: "features"
cellvit_cache_dir: "cellvit_features"

models:
  vit: "facebook/dinov2-base"
  # Read by main.py::run() when image_encoder="conch"
  # (features/vlm.py::load_conch, extract_vlm_features.ipynb use the same
  # name). The three lines this replaced (vlm_primary/vlm_secondary/
  # biomedbert -- BiomedCLIP/PLIP/PubMedBERT) were CODAPath-era leftovers:
  # nothing in the codebase reads them, superseded by CONCH (features/vlm.py).
  vlm: "MahmoodLab/CONCH"

training:
  probe_epochs: 100
  probe_lr: 0.001

# §6.4/§6.5: the final-training pass main.py::run()'s final_train_cfg
# controls, run AFTER a budget's points are selected. Not read automatically
# by main.py -- run_al_main.ipynb's EDIT cell builds FINAL_TRAIN_CFG from its
# own USE_LORA/AUX_LOSS/AUGMENT variables and passes it explicitly, the same
# way sampler_cfg is built from `samplers.<name>` plus OVERRIDES. This block
# exists so a config file alone documents the available axes and their
# defaults, without main.py silently defaulting to a shape a reader has to
# infer from training/finetune.py's own signature.
final_training:
  use_lora: false
  lora_r: 8
  lora_alpha: 16.0
  # REQUIRES use_lora: true. The auxiliary losses act on the encoder's
  # features; with the encoder frozen those carry no gradient, so the term is
  # a constant that changes nothing and the run would duplicate aux_loss:
  # "none" under a different filename. main.py refuses the combination.
  aux_loss: "none"        # none | center | supcon | triplet
  aux_weight: 0.5          # fixed at 0.5 for every aux_loss kind, once used
  augment: "none"          # none | flip_rotate

samplers:
  random: {}

  coreset:
    chunk_size: 10000

  typiclust:
    k_nn: 20
    chunk_size: 10000

  activeft:
    lr: 0.001          # official default in both ActiveFT variants
    temperature: 0.07  # official default
    iterations: 300    # official max_iter of the CIFAR variant (the ImageNet
                       # variant uses 100; more iterations only converges the
                       # same objective further, it is not a different method)
    balance: 1.0

  entropy:
    probe_epochs: 50
    probe_lr: 0.001

  margin:
    probe_epochs: 50
    probe_lr: 0.001

  badge:
    probe_epochs: 50
    probe_lr: 0.001

  uncertainty_herding:
    probe_epochs: 50
    probe_lr: 0.001
    chunk_size: 2000   

  # Not a runnable baseline (no entry in sampling/specs.py). These settings
  # exist because refine's candidate-generation ensemble calls dropquery by
  # name through the registry, and it needs the same hyperparameters the
  # official refine config gives it.
  dropquery:
    probe_epochs: 50
    probe_lr: 0.001
    dropout_ratio: 0.75  
    n_dropout: 3         

  refine:
    probe_epochs: 30
    probe_lr: 0.001
    filter_rounds: 5           # official progressive_depth
    filter_alpha: 0.4          # official alpha
    num_candidate_batches: 100 # official num_batches, a TOTAL split across the
                               # filter strategies (100 // 5 = 20 each per round).
                               # This is the method's whole cost: 5 strategies x 20
                               # batches x 5 rounds of sampler calls per budget.
                               # Lower it if a Kaggle session cannot finish, and say
                               # so when reporting -- it is a fidelity trade, not free.
    init_subset_size: 5000     # official init_subset_size
    max_pool_size: 10000       # official cap on the surviving pool after each round
    chunk_size: 2000           # stage-2 UncertaintyHerding coverage chunk

  # The project's own method: Uncertainty Herding's objective with the weight
  # replaced by visual/cell disagreement. See sampling/pact/.
  pact:
    uncertainty_mode: "disagreement"   # disagreement | visual_margin (ablation: plain UHerding weight)
    cell_source: "cellvit_embedding"   # cellvit_embedding | crop_dino (which cache field to read)
    cell_pooling: "mean"               # mean | rff | moments — how per-cell embeddings become one vector
    missing_impute: "mean"             # mean | zero — patches where CellViT found no nucleus
    reliability_mode: "valid"          # valid | mean_confidence
    num_rounds: 5
    chunk_size: 2000
    n_sigma: 2000                      # pool subsample for the round-1 bandwidth and the sigma floor
    # sigma >= this * bootstrap sigma. The floor exists because near-duplicate
    # tiles drive the labeled min-pairwise distance toward 0, which would
    # collapse the kernel into an indicator of duplicates.
    #
    # Lowered 0.25 -> 0.10 (2026-09-01). UHerding's Proposition 4 wants sigma
    # to keep shrinking as |L| grows, so the objective drifts from
    # coverage-like toward uncertainty-like -- that drift is the whole reason
    # one method works across budgets. Measured on histoset seed42, sigma fell
    # only 0.654 -> 0.210 across the sweep and was closing on the old floor of
    # 0.1635, while accuracy rank fell from 1st at budgets 25-125 to 6th at
    # 150-200. A floor at 0.0654 leaves room for the shrink to continue.
    sigma_floor_ratio: 0.10
    # Ceiling for the ECE temperature search, tighter than the paper grid's
    # 19.9. PACT compares TWO probes, and dividing both by a large T
    # flattens each softmax toward uniform -- two near-uniform distributions
    # cannot disagree. Measured retention of the Jensen-Shannon signal:
    # 100% at T=1, 9.9% at T=5, 0.7% at T=19.9. A real histoset run logged
    # `tau=19.9/19.9 js=0.0001`. The Uncertainty Herding and REFINE
    # baselines keep the full paper grid; only pact caps.
    max_temperature: 5.0
    probe_epochs: 100                  # matches training.probe_epochs (the evaluation probe) so
                                       # selection and final training share one budget. Every loop
                                       # early-stops on training loss after 20 flat epochs
                                       # (training/probe.py::_EarlyStopper), so a converged fit
                                       # costs far fewer than 100 in practice.
    probe_lr: 0.001
    probe_weight_decay: 0.0001
    # Semi-supervised coupling on the UNLABELED pool, masked to the region
    # both probes already call confidently (top pool_confidence_quantile of
    # each head's own confidence). The mask is what keeps it from fighting
    # acquisition: the contested region -- exactly what pact ranks on --
    # is excluded from the loss. 0 disables the term entirely.
    # Watch `pool_mask_fraction` in the trace: 0 means the gate never opened
    # and the run is the baseline under another filename.
    pool_consistency_weight: 0.0
    # RELATIVE, not absolute -- this project runs 3 datasets and the scales
    # differ. Quantile: the share of each head's own confidence tail that may
    # enter the loss. An absolute 0.9 admitted 67% / 49% / 42% of pathmnist /
    # histoset / skintissue at budget 200 (9 / 14 / 16 classes), i.e. three
    # different experiments under one number.
    pool_confidence_quantile: 0.5
    # How many pool rows the term uses per epoch is derived from the pool
    # size (half, capped at POOL_SUBSAMPLE_CAP in training/probe.py) rather
    # than configured: a fixed row count and a fixed fraction each break on
    # one end of this project's 4.6x pool-size spread.
    rff_dim: 64                        # cell_pooling=rff only
    rff_bandwidth: null                # null = deterministic median heuristic
    rff_bandwidth_sample_size: 2048
    rff_transform_batch_size: 32768
    diag: true

cellvit_extraction:
  # Do not silently reuse one scale/checkpoint for all datasets. Override these
  # fields only after confirming the source slide/patch resolution metadata.
  checkpoint: null
  architecture: "CellViT256"
  batch_size: 2                 # conservative for Kaggle T4/P100 16 GB
  magnification: null
  input_mpp: null
  model_mpp: null
  crop_padding: 0.25
  min_cell_area: 10
  max_cells_per_patch: null
  dino_crop_batch_size: 32      # DINO and CellViT coexist on the GPU
  datasets:
    pathmnist:
      # NCT-CRC-HE-100K patches are published at 0.5 microns/pixel (20x).
      checkpoint: null
      magnification: 20
      input_mpp: 0.5
      model_mpp: 0.5
    histoset:
      # Composite dataset: fill from the provenance of each source before use.
      checkpoint: null
      magnification: null
      input_mpp: null
      model_mpp: null
    skintissue:
      # Published tiles cover 100 x 100 microns at about 395 x 395 pixels.
      checkpoint: null
      magnification: 40
      input_mpp: 0.2531646
      model_mpp: 0.25

prompt_templates:
  - "Photomicrograph showing {}."
  - "Histopathology of {}."
  - "H&E stained microscopic image of {}."
  - "Pathological tissue section demonstrating {}."
  - "Cellular morphology characteristic of {}."

datasets:
  pathmnist:
    path: "data/pathmnist_224.npz"
    num_classes: 9
    # Class names in the canonical order every stage of the pipeline
    # uses: the probe's label ids, the coverage kernel's columns, and the
    # text prototypes built by extract_vlm_features.ipynb. Text lives in
    # config/descriptions/{dataset}_{style}.json, written once by
    # generate_class_description.ipynb and committed -- not here.
    class_names:
      - adipose
      - background
      - debris
      - lymphocytes
      - mucus
      - smooth_muscle
      - normal_colon_mucosa
      - cancer_associated_stroma
      - colorectal_adenocarcinoma

  histoset:
    path: "data/HistoSet-5x14/HistoSet-5x14"
    num_classes: 14
    # Class names in the canonical order every stage of the pipeline
    # uses: the probe's label ids, the coverage kernel's columns, and the
    # text prototypes built by extract_vlm_features.ipynb. Text lives in
    # config/descriptions/{dataset}_{style}.json, written once by
    # generate_class_description.ipynb and committed -- not here.
    class_names:
      - breast_benign
      - breast_malignant
      - colon_aca
      - colon_n
      - lung_aca
      - lung_n
      - lung_scc
      - oral_normal_oral_cavity
      - oral_oscc
      - ovarian_clear_cell
      - ovarian_endometri
      - ovarian_mucinous
      - ovarian_non_cancerous
      - ovarian_serous

  skintissue:
    path: "data/SkinTissue/SkinTissue/tiles"
    num_classes: 16
    # Class names in the canonical order every stage of the pipeline
    # uses: the probe's label ids, the coverage kernel's columns, and the
    # text prototypes built by extract_vlm_features.ipynb. Text lives in
    # config/descriptions/{dataset}_{style}.json, written once by
    # generate_class_description.ipynb and committed -- not here.
    class_names:
      - tumor_skin_epithelial_bcc
      - tumor_skin_epithelial_sqcc
      - tumor_skin_melanoma_melanoma
      - tumor_skin_naevus_naevus
      - nontumor_skin_epidermis_epidermis
      - nontumor_skin_dermis_dermis
      - nontumor_skin_subcutis_subcutis
      - nontumor_skin_hairfollicle_hairfollicle
      - nontumor_skin_sebaceousglands_sebaceousglands
      - nontumor_skin_sweatglands_sweatglands
      - nontumor_skin_vessel_vessel
      - nontumor_skin_nerves_nerves
      - nontumor_skin_muscle_skeletal
      - nontumor_skin_chondraltissue_chondraltissue
      - nontumor_skin_elastosis_elastosis
      - nontumor_skin_necrosis_necrosis
