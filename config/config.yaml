dataset: "pathmnist"
sampler_name: "codapath"
random_seed: 42
device: "cuda"

cumulative_budget: [25, 50, 75, 100, 125, 150, 175, 200]
feature_cache_dir: "features"
nucleus_cache_dir: "nucleus_features"

models:
  vit: "facebook/dinov2-base"              
  vlm_primary: "hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
  vlm_secondary: "vinid/plip"
  biomedbert: "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext"

training:
  probe_epochs: 100
  probe_lr: 0.001

samplers:
  random: {}

  coreset:
    chunk_size: 10000

  typiclust:
    k_nn: 20
    chunk_size: 10000

  activeft:
    lr: 0.001          # paper/official default (was 0.01 = 10× too high)
    temperature: 0.07
    iterations: 100
    balance: 1.0

  codapath:
    alpha: 0.5         
    chunk_size: 10000

  entropy:
    probe_epochs: 50
    probe_lr: 0.001

  margin:
    probe_epochs: 50
    probe_lr: 0.001

  badge:
    probe_epochs: 50
    probe_lr: 0.001

  uncertainty_herding:
    probe_epochs: 50
    probe_lr: 0.001
    chunk_size: 2000
    num_rounds: 5

  tcm:
    probe_epochs: 50
    probe_lr: 0.001
    k_nn: 20
    chunk_size: 5000

  dropquery:
    probe_epochs: 50
    probe_lr: 0.001
    dropout_ratio: 0.75  
    n_dropout: 3         

  refine:
    probe_epochs: 30
    probe_lr: 0.001
    filter_rounds: 5       # progressive-filter rounds (paper)
    filter_alpha: 0.4      # subsample ratio per round (paper)
    filter_batches: 5      # queries per strategy per round (paper uses ~10; raise if compute allows)
    init_subset_size: 5000 # round-1 fixed subsample (paper)
    chunk_size: 2000       # stage-2 UncertaintyHerding coverage chunk

  scalpel:
    num_rounds: 5             # iterative AL rounds (like SaE T=5)
    chunk_size: 2000          # greedy coverage chunk size (DINOv2 space)
    kappa: 1.0                # vacuity evidence scale λ=κ·L/(H+0.1)
    probe_epochs: 50          # per-round probe epochs (morphology + stain)
    probe_lr: 0.001           # per-round probe lr
    use_stain_discount: true  # false → plain margin uncertainty (ablation)
    diag: true                # print probe acc + stain-shortcut hypothesis check
    n_sigma: 2000             # subsample size for adaptive sigma
    use_adaptive_cap: false              # false → original fixed t=r/(T-1) schedule (ablation)
    gap_trend_thresh: 0.005             # round-over-round gap growth below this = "not widening"
    gap_abs_thresh: 0.03                # gap below this = "shortcut too weak to trust"
    t_cap_value: 0.4                    # cap on t once adaptive cap triggers
    min_labels_per_class_for_cap: 2.0   # min avg labels/class before trusting the gap estimate
    use_rank_normalize: true           # true → rank-normalize vac/reconcile instead of minmax (test independently of use_adaptive_cap)

  nucleus_al:
    num_rounds: 5
    chunk_size: 2000
    n_sigma: 2000
    probe_epochs: 50
    probe_lr: 0.001
    probe_weight_decay: 0.0001
    cell_source: "cellvit_embedding"   # cellvit_embedding | crop_dino
    uncertainty_mode: "disagreement"  # cell_margin | disagreement | fusion_concat | fusion_add
    reliability_mode: "valid"         # valid | mean_confidence
    fusion_min_labels_per_class: 2.0
    fusion_normalize_logits: false     # true = row-LN ablation before concat/add
    diag: true

  # Controlled coverage-space experiment. This uses DINO margin uncertainty
  # multiplied by candidate marginal coverage; it is not the UCoverage
  # objective of standard Uncertainty Herding.
  nucleus_coverage:
    cell_source: "cellvit_embedding"
    coverage_source: "dino"            # dino | cellvit | concat
    missing_impute: "mean"             # mean | zero (ablation only)
    num_rounds: 5
    chunk_size: 2000
    n_sigma: 2000
    sigma_floor_ratio: 0.25
    probe_epochs: 50
    probe_lr: 0.001
    probe_weight_decay: 0.0001
    diag: true

  # Two independent UCoverage branches propose 2A samples each; the default
  # finalizer restarts from the true labeled set and performs joint greedy on
  # their union. RRF/Borda/score are fusion ablations without a submodular
  # guarantee. ``rff`` is a Gaussian kernel mean embedding of the cell bag.
  dual_view_uherding:
    cell_source: "cellvit_embedding"
    cell_pooling: "mean"               # mean | rff
    uncertainty_mode: "branch_margin"  # branch_margin | disagreement
    fusion_mode: "joint"               # joint | rrf | borda | score | visual_then_cell | cell_then_visual
    alpha: 0.5
    shortlist_multiplier: 2
    rrf_k: 60.0
    num_rounds: 5
    candidate_pool_size: 8000           # relevant-set kernel cap; null = full pool (small datasets only)
    chunk_size: 1000
    n_sigma: 2000
    probe_epochs: 50
    probe_lr: 0.001
    probe_weight_decay: 0.0001
    consistency_weight: 0.0             # 0 = independent CE probes (primary)
    consistency_mode: "symmetric_js"   # symmetric_js | visual_teacher | cell_teacher
    reliability_mode: "valid"
    rff_dim: 64
    rff_bandwidth: null                  # null = deterministic median heuristic
    rff_bandwidth_sample_size: 2048
    rff_transform_batch_size: 32768
    diag: true

  # Direct controlled rerun of the old disagreement experiment: calibrated
  # JSD replaces margin inside proper DINO UCoverage; no cell coverage branch.
  disagreement_uherding:
    cell_source: "cellvit_embedding"
    cell_pooling: "mean"                # mean | rff
    num_rounds: 5
    candidate_pool_size: 8000
    chunk_size: 1000
    n_sigma: 2000
    probe_epochs: 50
    probe_lr: 0.001
    probe_weight_decay: 0.0001
    consistency_weight: 0.0
    consistency_mode: "symmetric_js"
    reliability_mode: "valid"
    rff_dim: 64
    rff_bandwidth: null
    rff_bandwidth_sample_size: 2048
    rff_transform_batch_size: 32768
    diag: true

nucleus_extraction:
  # Do not silently reuse one scale/checkpoint for all datasets. Override these
  # fields only after confirming the source slide/patch resolution metadata.
  checkpoint: null
  architecture: "CellViT256"
  batch_size: 2                 # conservative for Kaggle T4/P100 16 GB
  magnification: null
  input_mpp: null
  model_mpp: null
  crop_padding: 0.25
  min_cell_area: 10
  max_cells_per_patch: null
  dino_crop_batch_size: 32      # DINO and CellViT coexist on the GPU
  datasets:
    pathmnist:
      # NCT-CRC-HE-100K patches are published at 0.5 microns/pixel (20x).
      checkpoint: null
      magnification: 20
      input_mpp: 0.5
      model_mpp: 0.5
    histoset:
      # Composite dataset: fill from the provenance of each source before use.
      checkpoint: null
      magnification: null
      input_mpp: null
      model_mpp: null
    skintissue:
      # Published tiles cover 100 x 100 microns at about 395 x 395 pixels.
      checkpoint: null
      magnification: 40
      input_mpp: 0.2531646
      model_mpp: 0.25

prompt_templates:
  - "Photomicrograph showing {}."
  - "Histopathology of {}."
  - "H&E stained microscopic image of {}."
  - "Pathological tissue section demonstrating {}."
  - "Cellular morphology characteristic of {}."

datasets:
  pathmnist:
    path: "data/pathmnist_224.npz"
    num_classes: 9
    descriptions:
      adipose: "adipose tissue consisting of mature adipocytes and fat cells"
      background: "empty background space without any tissue structures or cells"
      debris: "necrotic debris, cellular fragments, and hemorrhagic exudate"
      lymphocytes: "dense infiltration of lymphocytes and immune cells"
      mucus: "acellular mucin and mucus material"
      smooth_muscle: "smooth muscle tissue with elongated muscle fibers"
      normal_colon_mucosa: "benign, healthy normal colon mucosa and colonic glands"
      cancer_associated_stroma: "cancer-associated stroma and connective tissue fibroblasts"
      colorectal_adenocarcinoma: "colorectal adenocarcinoma epithelial cells forming malignant glands"

  histoset:
    path: "data/HistoSet-5x14/HistoSet-5x14"
    num_classes: 14
    descriptions:
      breast_benign: "benign breast tissue, showing non-cancerous fibroadenoma or adenosis"
      breast_malignant: "malignant breast carcinoma, invasive ductal or lobular cancer cells"
      colon_aca: "colon adenocarcinoma, characterized by irregular malignant glandular structures"
      colon_n: "benign, healthy colonic tissue with normal mucosal glands"
      lung_aca: "lung adenocarcinoma, consisting of malignant glandular epithelial cells"
      lung_n: "benign, healthy and normal lung tissue without malignancy"
      lung_scc: "lung squamous cell carcinoma, showing malignant squamous epithelial cells"
      oral_normal_oral_cavity: "normal oral cavity squamous epithelium without atypia"
      oral_oscc: "oral squamous cell carcinoma, invasive malignant squamous cells with keratin pearls"
      ovarian_clear_cell: "ovarian clear cell carcinoma with clear cytoplasm"
      ovarian_endometri: "ovarian endometrioid carcinoma resembling endometrial glands"
      ovarian_mucinous: "ovarian mucinous carcinoma with mucin-producing cells"
      ovarian_non_cancerous: "benign, non-cancerous ovarian tissue stroma and follicles"
      ovarian_serous: "ovarian serous carcinoma with papillary architecture"

  skintissue:
    path: "data/SkinTissue/SkinTissue/tiles"
    num_classes: 16
    descriptions:
      tumor_skin_epithelial_bcc: "basal cell carcinoma, displaying nests of atypical basaloid cells with characteristic peripheral palisading and stromal retraction artifact"
      tumor_skin_epithelial_sqcc: "squamous cell carcinoma, featuring invasive islands of atypical squamous epithelial cells, pleomorphic nuclei, and keratin pearls"
      tumor_skin_melanoma_melanoma: "malignant melanoma, characterized by invasive and highly atypical melanocytes, severe nuclear pleomorphism, and variable melanin pigmentation"
      tumor_skin_naevus_naevus: "benign melanocytic nevus, showing well-circumscribed nests of uniform, benign nevus cells without significant atypia"
      nontumor_skin_epidermis_epidermis: "normal epidermis with stratified squamous epithelium, distinct basal, spinous, and granular layers topped by stratum corneum"
      nontumor_skin_dermis_dermis: "normal dermal connective tissue with dense interwoven collagen bundles and scattered fibroblasts"
      nontumor_skin_subcutis_subcutis: "normal subcutis consisting of mature adipose tissue and fat cells divided by fibrous septa"
      nontumor_skin_hairfollicle_hairfollicle: "benign hair follicles displaying epithelial root sheaths, hair shafts, and surrounding fibrous connective tissue"
      nontumor_skin_sebaceousglands_sebaceousglands: "normal sebaceous glands composed of lobules with pale, foamy, lipid-filled sebocytes"
      nontumor_skin_sweatglands_sweatglands: "normal sweat glands showing coiled tubular structures lined by simple or stratified cuboidal epithelial cells"
      nontumor_skin_vessel_vessel: "benign blood vessels featuring endothelial cell linings, smooth muscle walls, and luminal spaces containing erythrocytes"
      nontumor_skin_nerves_nerves: "benign peripheral nerve bundles consisting of wavy nerve fibers and elongated Schwann cell nuclei"
      nontumor_skin_muscle_skeletal: "normal skeletal muscle featuring bundles of striated, multinucleated muscle fibers"
      nontumor_skin_chondraltissue_chondraltissue: "benign chondral tissue featuring chondrocytes residing within lacunae and surrounding cartilaginous extracellular matrix"
      nontumor_skin_elastosis_elastosis: "solar elastosis showing basophilic degeneration and accumulation of thick, clumped abnormal elastic fibers in the dermis"
      nontumor_skin_necrosis_necrosis: "necrotic tissue characterized by eosinophilic cellular debris, loss of nuclear detail, and structureless dead tissue"
